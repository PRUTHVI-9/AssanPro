apply plugin: 'com.android.application'

android {
    compileSdk 31
    defaultConfig {
        applicationId 'com.example.AsaanPro_V1'
        minSdk 24
        targetSdk 31
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
    }
    namespace 'com.example.AsaanPro_V1'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
   /* implementation files('/home/bhalchandra/AndroidStudioProjects/AsaanPro_V1/app/libs/commons-net-3.3.jar')
    implementation files('libs/commons-net-3.3.jar')*/
    implementation 'commons-net:commons-net:3.9.0'

}

